name: Build Legacy APK

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  build:
    runs-on: ubuntu-20.04

    env:
      ANDROID_NDK_VERSION: r12b

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      # Java 17 ONLY for sdkmanager
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install required system packages
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update

          sudo apt-get install -y \
            libc6:i386 \
            libstdc++6:i386 \
            zlib1g:i386 \
            libncurses5:i386 \
            unzip \
            wget

      - name: Install Android SDK 27
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            --sdk_root=$ANDROID_HOME \
            "platforms;android-27" \
            "build-tools;27.0.1"

      - name: Download Android NDK r12b
        run: |
          wget https://dl.google.com/android/repository/android-ndk-r12b-linux-x86_64.zip -O ndk.zip
          unzip -q ndk.zip

          echo "ANDROID_NDK_HOME=$PWD/android-ndk-r12b" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$PWD/android-ndk-r12b" >> $GITHUB_ENV

      # Switch to Java 8 for old Gradle/AGP
      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Create local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "ndk.dir=$PWD/android-ndk-r12b" >> local.properties

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Clean Gradle cache
        run: |
          rm -rf ~/.gradle/caches/
          rm -rf ~/.gradle/daemon/

      - name: Build Debug APK
        run: |
          ./gradlew \
            clean \
            assembleDebug \
            --stacktrace \
            --info \
            -Dcom.android.repository.NoVersionCheck=true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
